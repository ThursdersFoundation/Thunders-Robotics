; Top-level PlatformIO configuration for the Thunders Robotic firmware.
;
; This file aggregates the five firmware sub-projects as separate
; environments so they can be built together (the default_envs list) or
; individually (`pio run -e <name>`). Each sub-project also ships its own
; platformio.ini with the full per-board configuration; this file is the
; convenience entry point and the home of the shared [common] flags.
;
; Build all:   pio run
; Build one:   pio run -e motor_controller

[platformio]
default_envs =
    motor_controller
    sensor_node
    communication
    actuator_controller
    diagnostics

; Flags pulled into every sub-project env below via ${common.build_flags}.
[common]
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------- motor_controller (ESP32-WROOM-32) ----------
[env:motor_controller]
platform      = espressif32@^6.5.0
board         = esp32dev
framework     = arduino
src_dir       = motor_controller
monitor_speed = 115200
upload_speed  = 921600
build_flags   =
    ${common.build_flags}
    -Imotor_controller/include
lib_deps      =
    madhephaestus/ESP32Encoder @ ^0.11.0
    bblanchon/ArduinoJson @ ^6.21.0

; ---------- sensor_node (ESP32-S3-DevKitC) ----------
[env:sensor_node]
platform      = espressif32@^6.5.0
board         = esp32s3box
framework     = arduino
src_dir       = sensor_node
monitor_speed = 115200
upload_speed  = 921600
build_flags   =
    ${common.build_flags}
    -Isensor_node/include
lib_deps      =
    adafruit/Adafruit BNO055 @ ^1.6.0
    adafruit/Adafruit Unified Sensor @ ^1.1.0
    bblanchon/ArduinoJson @ ^6.21.0

; ---------- communication (ESP32-WROOM-32) ----------
[env:communication]
platform      = espressif32@^6.5.0
board         = esp32dev
framework     = arduino
src_dir       = communication
monitor_speed = 115200
upload_speed  = 921600
build_flags   =
    ${common.build_flags}
    -Icommunication/include
lib_deps      =
    bblanchon/ArduinoJson @ ^6.21.0

; ---------- actuator_controller (ESP32-C3) ----------
[env:actuator_controller]
platform      = espressif32@^6.5.0
board         = esp32-c3-devkitm-1
framework     = arduino
src_dir       = actuator_controller
monitor_speed = 115200
upload_speed  = 921600
build_flags   =
    ${common.build_flags}
    -Iactuator_controller/include
    -Icommunication/include
    -DCOMM_AS_LIBRARY
lib_deps      = communication
lib_extra_dirs =
    libraries
    communication

; ---------- diagnostics (ESP32-WROOM-32, no per-project pio.ini) ----------
[env:diagnostics]
platform      = espressif32@^6.5.0
board         = esp32dev
framework     = arduino
src_dir       = diagnostics
monitor_speed = 115200
upload_speed  = 921600
build_flags   =
    ${common.build_flags}
    -Idiagnostics/include
