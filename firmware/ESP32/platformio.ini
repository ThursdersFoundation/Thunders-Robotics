; PlatformIO project configuration for Thunders Robotic — ESP32 firmware
; Documentation: https://docs.platformio.org/
;
; Environments:
;   esp32dev  → ESP32-WROOM (default, well-tested)
;   esp32s3   → ESP32-S3-DevKitC-1
;   esp32c3   → ESP32-C3-DevKitM-1
;   native    → host-side unit tests (no hardware required)

[platformio]
default_envs = esp32dev
boards_dir    =
lib_extra_dirs = lib

; ─── Common flags shared by every target ─────────────────────────────────
[common]
build_flags =
    -std=gnu++17
    -Os
    -Wall -Wextra -Wno-unused-parameter
    -Wno-missing-field-initializers
    -D PLATFORMIO=1
    -D ARDUINO_ARCH_ESP32=1
    -D CORE_DEBUG_LEVEL=3
    -D THUNDERS_BOARD=\"esp32dev\"
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BNO055 @ ^1.6.3
    madhephaestus/ESP32Encoder @ ^0.11.7
lib_ldf_mode = deep+

; ─── ESP32-WROOM (default) ────────────────────────────────────────────────
[env:esp32dev]
platform    = espressif32@^6.5.0
board       = esp32dev
framework   = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed  = 921600
upload_port   = /dev/ttyUSB0
monitor_port  = /dev/ttyUSB0
monitor_filters = esp32_exception_decoder, colorize, time
build_flags =
    ${common.build_flags}
    -D THUNDERS_BOARD=\"esp32dev\"
lib_deps = ${common.lib_deps}

; ─── ESP32-S3 ────────────────────────────────────────────────────────────
[env:esp32s3]
platform    = espressif32@^6.5.0
board       = esp32-s3-devkitc-1
framework   = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    ${common.build_flags}
    -D THUNDERS_BOARD=\"esp32s3\"
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = ${common.lib_deps}

; ─── ESP32-C3 (RISC-V, low-power) ────────────────────────────────────────
[env:esp32c3]
platform    = espressif32@^6.5.0
board       = esp32-c3-devkitm-1
framework   = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    ${common.build_flags}
    -D THUNDERS_BOARD=\"esp32c3\"
lib_deps = ${common.lib_deps}

; ─── Native (host-side unit tests, no hardware) ──────────────────────────
[env:native]
platform    = native@^1.2.0
build_flags =
    -std=gnu++17
    -O0 -g
    -D THUNDERS_NATIVE=1
    -D UNIT_TEST
    -Itest/mock
lib_deps =
test_build_src = true
