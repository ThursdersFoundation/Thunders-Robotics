# =============================================================================
# thunders-robotic / resources / sensors.yaml
# -----------------------------------------------------------------------------
# Sensor configuration: port assignments, sample rates, calibration, and
# filter parameters for every sensor on the Thunders robot.
#
# Consumed by:
#   - thunders/sensors/*.cpp (Sensor base class and subclasses)
#   - thunders/sensors/sensor_manager.cpp (lifecycle management)
#   - firmware/esp32/src/drivers/*.cpp
#   - firmware/stm32/Drivers/thunders_drivers/{imu,encoder}/
#
# Port assignment convention (matches SensorConstants.java):
#   DIO 0-3   Swerve module absolute encoders (CTRE mag encoders)
#   DIO 4-5   Arm joint absolute encoders
#   DIO 6     Elevator string-pot encoder
#   DIO 7-8   Elevator top/bottom limit switches (NC)
#   DIO 9     Climb hook engagement sensor
#   AI  0     Battery voltage monitor
#   AI  1     Front ultrasonic distance sensor
#   SPI 0     ADXRS450 yaw gyro (onboard FPGA)
#   SPI 1     ADIS16470 IMU
#   I2C 0     Colour sensor (optional)
#
# SPDX-License-Identifier: BSD-3-Clause
# Copyright (c) 2024-2026 Thunders Robotics. All rights reserved.
# =============================================================================

# --- Global sensor manager --------------------------------------------------
sensor_manager:
  init_timeout_s: 2.0
  read_failure_threshold: 5          # auto-disable sensor after N consecutive failures
  publish_health_rate_hz: 2          # dashboard health report cadence

# --- Gyroscope (primary yaw) ------------------------------------------------
gyroscope:
  type: "ADXRS450"
  spi_port: 0
  sample_rate_hz: 200
  calibration_time_s: 1.0           # robot must be stationary during this
  drift_compensation_deg_per_min: 0.5
  enable_vision_fusion: true        # fuse AprilTag poses to correct drift

# --- IMU (6-DOF attitude) ---------------------------------------------------
imu:
  type: "ADIS16470"
  spi_port: 1
  sample_rate_hz: 200
  calibration_time_s: 5.0           # longer than gyro; robot must be level
  complementary_filter_alpha: 0.98  # 98% gyro, 2% accel
  yaw_axis: "Z"
  pitch_axis: "X"
  roll_axis: "Y"
  axes:
    yaw:   { inverted: false, scale: 1.0 }
    pitch: { inverted: false, scale: 1.0 }
    roll:  { inverted: false, scale: 1.0 }
  # Bias correction (applied to every sample).
  bias:
    gyro_x_rad_per_s: 0.0
    gyro_y_rad_per_s: 0.0
    gyro_z_rad_per_s: 0.0
    accel_x_mps2: 0.0
    accel_y_mps2: 0.0
    accel_z_mps2: 0.0

# --- Swerve module absolute encoders ----------------------------------------
swerve_encoders:
  front_left:
    dio_port: 0
    type: "duty_cycle"              # CTRE mag encoder reports duty cycle
    offset_deg: -0.5               # angle when module points forward
    inversion: false
    units: "degrees"
  front_right:
    dio_port: 1
    type: "duty_cycle"
    offset_deg: 90.2
    inversion: false
    units: "degrees"
  back_left:
    dio_port: 2
    type: "duty_cycle"
    offset_deg: 179.8
    inversion: false
    units: "degrees"
  back_right:
    dio_port: 3
    type: "duty_cycle"
    offset_deg: -89.9
    inversion: false
    units: "degrees"

# --- Arm joint encoders -----------------------------------------------------
arm_encoders:
  shoulder:
    dio_port: 4
    type: "absolute"
    offset_deg: 12.3
    gear_ratio: 1.0                 # encoder on joint output shaft
    units: "degrees"
  elbow:
    dio_port: 5
    type: "absolute"
    offset_deg: -45.6
    gear_ratio: 1.0
    units: "degrees"

# --- Elevator sensors -------------------------------------------------------
elevator_sensors:
  string_pot:
    dio_port: 6
    type: "string_pot"
    ticks_per_meter: 4096.0
    zero_offset_ticks: 0
    max_travel_m: 1.80
    filter_alpha: 0.3               # EMA filter coefficient
  bottom_limit_switch:
    dio_port: 7
    type: "limit_switch"
    normally_closed: true
    invert: true                    # true when switch pressed
  top_limit_switch:
    dio_port: 8
    type: "limit_switch"
    normally_closed: true
    invert: true

# --- Ultrasonic distance sensor (front) -------------------------------------
ultrasonic_front:
  type: "analog"                    # analog | digital_ping
  analog_port: 1
  trigger_pin: -1                   # not used in analog mode
  echo_pin: -1
  sample_rate_hz: 20
  max_range_m: 3.0
  min_range_m: 0.02
  speed_of_sound_mps: 343.0
  voltage_offset: 0.0
  scale_v_per_m: 0.5                # Vcc/512 per inch -> ~0.5 V/m
  filter:
    type: "median_3"                # median-of-3 to suppress multipath
    window_size: 3
  threshold_m: 0.30                 # trigger distance for "object detected"

# --- Infrared distance sensors ----------------------------------------------
# Sharp GP2Y0A21YK analog IR sensors. Useful at short range where ultrasonics
# struggle with thin objects.
infrared_sensors:
  intake_throat:
    analog_port: 2
    type: "GP2Y0A21YK"
    sample_rate_hz: 50
    min_range_m: 0.10
    max_range_m: 0.80
    filter_alpha: 0.3
    calibration_curve: "sharp_27_v_minus_0p5"   # d = 27/(V-0.5) cm
    threshold_m: 0.15              # game piece detection threshold
  elevator_load:
    analog_port: 3
    type: "GP2Y0A21YK"
    sample_rate_hz: 50
    min_range_m: 0.10
    max_range_m: 0.80
    filter_alpha: 0.3
    calibration_curve: "sharp_27_v_minus_0p5"
    threshold_m: 0.20

# --- LiDAR (2D scanner) -----------------------------------------------------
lidar:
  type: "RPLIDAR_A2"
  serial_port: "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller-if00-port0"
  baud_rate: 115200
  sample_rate_hz: 10                # 10 Hz scan rate
  max_range_m: 8.0
  angle_min_rad: -3.14159           # full 360 deg scan
  angle_max_rad:  3.14159
  angle_increment_rad: 0.01745      # 1 deg resolution
  filter:
    type: "median"
    window_size: 3
  # For obstacle avoidance: only consider readings within this cone.
  avoidance_cone_deg: 90           # forward 90 deg cone
  inflation_radius_m: 0.15         # inflate obstacles by this much

# --- GPS (outdoor mode, optional) -------------------------------------------
gps:
  enabled: false                    # disabled for indoor FRC; enable for outdoor
  type: "u_blox_NEO_M9N"
  uart_port: "/dev/ttyACM0"
  baud_rate: 9600
  sample_rate_hz: 5
  fix_timeout_s: 30.0              # wait up to 30s for first fix
  min_fix_type: "3D"               # NO_FIX | 2D | 3D | RTK_FLOAT | RTK_FIXED
  max_hdop: 2.0                    # reject fixes with higher dilution

# --- Camera (vision processing) ---------------------------------------------
# Camera is on a co-processor (Raspberry Pi 4 running PhotonVision). The
# RoboRIO consumes results via NetworkTables.
camera:
  enabled: true
  coprocessor_ip: "10.99.99.11"
  photonvision_table: "photonvision/thunders_cam"
  resolution: "1280x720"
  fps: 30
  pixel_format: "BGR8"
  exposure_us: 20000               # manual exposure; auto is too slow
  gain: 1.0
  white_balance_k: 5500
  # Camera-to-robot transform (metres, radians). Determined by calibration.
  transform:
    x_m: 0.15
    y_m: 0.0
    z_m: 0.30
    roll_rad: 0.0
    pitch_rad: 0.0
    yaw_rad: 0.0
  ambiguity_max: 0.2               # reject pose estimates above this
  latency_compensation_s: 0.05     # 50 ms typical capture+process delay

# --- Force / load cell ------------------------------------------------------
force_sensor:
  enabled: false                    # optional; used on gripper robots
  type: "HX711"
  data_pin: 10
  clock_pin: 11
  sample_rate_hz: 80
  max_force_n: 50.0
  scale_n_per_count: 0.001
  tare_counts: 0
  filter_alpha: 0.3
  threshold_n: 5.0

# --- Power distribution panel -----------------------------------------------
pdp:
  can_id: 1
  type: "CTRE"                     # CTRE | REV
  publish_rate_hz: 2
  channels:
    drivetrain_fl_drive: 0
    drivetrain_fl_steer: 1
    drivetrain_fr_drive: 2
    drivetrain_fr_steer: 3
    drivetrain_bl_drive: 4
    drivetrain_bl_steer: 5
    drivetrain_br_drive: 6
    drivetrain_br_steer: 7
    arm_shoulder: 8
    arm_elbow: 9
    elevator: 10
    intake_roller: 11
    shooter_top: 12
    shooter_bottom: 13
    climber_left: 14
    climber_right: 15

# --- Battery monitor --------------------------------------------------------
battery:
  voltage_publish_rate_hz: 5
  low_threshold_v: 11.0
  critical_threshold_v: 10.5
  auto_disable_below_v: 10.0
